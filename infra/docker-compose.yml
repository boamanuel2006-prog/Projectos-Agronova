services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: agronova
      POSTGRES_USER: agronova
      POSTGRES_PASSWORD: agronova
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
  redis:
    image: redis:8-alpine
    ports: ["6379:6379"]
  api:
    build: ../backend
    environment:
      DJANGO_SECRET_KEY: change-me-in-production
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,api
      POSTGRES_DB: agronova
      POSTGRES_USER: agronova
      POSTGRES_PASSWORD: agronova
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    depends_on: [db, redis]
volumes:
  postgres_data:
