services:
  db:
    image: postgres:17
    restart: unless-stopped
    env_file: ../.env.production
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis_data:/data]

  api:
    build: ../backend
    restart: unless-stopped
    env_file: ../.env.production
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    volumes: [static_data:/app/staticfiles, media_data:/app/media]

  worker:
    build: ../backend
    restart: unless-stopped
    env_file: ../.env.production
    command: ["celery", "-A", "config.celery:app", "worker", "--loglevel=INFO"]
    depends_on: [api]

  web:
    build:
      context: ../web
      args:
        VITE_API_URL: /api/v1
    restart: unless-stopped

  gateway:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports: ["80:80"]
    depends_on: [api, web]
    volumes:
      - ./nginx/release.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/static:ro
      - media_data:/media:ro

volumes:
  postgres_data:
  redis_data:
  static_data:
  media_data:
