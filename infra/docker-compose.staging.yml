services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: agronova_staging
      POSTGRES_USER: agronova
      POSTGRES_PASSWORD: agronova_staging_only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agronova -d agronova_staging"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes: [staging_pg:/var/lib/postgresql/data]

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes: [staging_redis:/data]

  api:
    build: ../backend
    environment:
      DJANGO_SECRET_KEY: staging-only-change-me
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,api
      CORS_ALLOWED_ORIGINS: http://localhost:8080
      POSTGRES_DB: agronova_staging
      POSTGRES_USER: agronova
      POSTGRES_PASSWORD: agronova_staging_only
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      SECURE_SSL_REDIRECT: "0"
      DEFAULT_PAYMENT_PROVIDER: mock
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    ports: ["8000:8000"]

  worker:
    build: ../backend
    command: ["celery", "-A", "config.celery:app", "worker", "--loglevel=INFO"]
    environment:
      DJANGO_SECRET_KEY: staging-only-change-me
      DJANGO_DEBUG: "0"
      POSTGRES_DB: agronova_staging
      POSTGRES_USER: agronova
      POSTGRES_PASSWORD: agronova_staging_only
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
    depends_on:
      api: {condition: service_started}

  web:
    build:
      context: ../web
      args:
        VITE_API_URL: http://localhost:8000/api/v1
    ports: ["8080:80"]
    depends_on: [api]

volumes:
  staging_pg:
  staging_redis:
